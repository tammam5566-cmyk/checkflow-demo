  { label: "قبل 3 أيام", completion: 74, quality: 71 },

let idCounter = 100;
const nextId = (prefix) => `${prefix}${idCounter++}`;
const STORAGE_KEY = "checkflow-demo-state-v2";

function CheckflowDemo() {
  const [module, setModule] = useState(null);
  const [hrRole, setHrRole] = useState(null);
  const [guidelines, setGuidelines] = useState(GUIDE_CATEGORIES_SEED);
  const [employees, setEmployees] = useState(EMPLOYEES_SEED);
  const [tasks, setTasks] = useState(TASKS_SEED);
  const [corrective, setCorrective] = useState([]);
  const [departments, setDepartments] = useState(DEPARTMENTS_SEED);
  const [branches, setBranches] = useState(BRANCHES_SEED);
  const [permissions, setPermissions] = useState({ users: {} });
  const [currentUserId, setCurrentUserId] = useState(null);
  const [adminTab, setAdminTab] = useState("overview");
  const [openTask, setOpenTask] = useState(null);
  const [showAddTask, setShowAddTask] = useState(false);
  const [showAddUser, setShowAddUser] = useState(false);
  const [loaded, setLoaded] = useState(false);

  // load saved data — reusable so we can also refresh right at login time
  function applyRecurringReset(tasksArr) {
    const key = todayKey();
    return tasksArr.map((t) =>
      t.day === "دائمة" && (t.status === "done" || t.status === "non_compliant") && t.completedDateKey !== key
        ? { ...t, status: "not_started", result: "", note: "", completedAt: null, verified: false, photo: null, completedDateKey: null }
        : t
    );
  }

  async function refreshFromStorage() {
    try {
      if (window.storage && window.storage.get) {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const data = JSON.parse(res.value);
          if (data.employees) setEmployees(data.employees);
          if (data.guidelines) setGuidelines(data.guidelines);
          if (data.tasks) setTasks(applyRecurringReset(data.tasks));
          if (data.corrective) setCorrective(data.corrective);
          if (data.departments) setDepartments(data.departments);
          if (data.branches) setBranches(data.branches);
          if (data.permissions) setPermissions(data.permissions);
          if (typeof data.idCounter === "number") idCounter = data.idCounter;
        }
      }
    } catch (e) { /* no saved state yet — keep current defaults */ }
  }

  React.useEffect(() => {
    let cancelled = false;
    async function init() {
      await refreshFromStorage();
      if (!cancelled) setLoaded(true);
    }
    init();
    return () => { cancelled = true; };
  }, []);

  // save on every change, once initial load has completed
  async function saveNow() {
    try {
      if (window.storage && window.storage.set) {
        await window.storage.set(STORAGE_KEY, JSON.stringify({ employees, tasks, corrective, departments, branches, permissions, guidelines, idCounter }));
        return true;
      }
    } catch (e) { /* saving is best-effort */ }
    return false;
  }

  React.useEffect(() => {
    if (!loaded) return;
    saveNow();
  }, [employees, tasks, corrective, departments, branches, permissions, guidelines, loaded]);

  // keep tabs/sessions in sync: if storage changes elsewhere, pick it up here too
  React.useEffect(() => {
    function onStorageEvent(e) {
      if (e.key === STORAGE_KEY) refreshFromStorage();
    }
    window.addEventListener("storage", onStorageEvent);
    return () => window.removeEventListener("storage", onStorageEvent);
  }, []);

  function handleLogin(userId) {
    setCurrentUserId(userId);
  }

  const currentUser = employees.find((e) => e.id === currentUserId) || null;
  const employeeName = (id) => employees.find((e) => e.id === id)?.name || "—";
  const departmentName = (id) => departments.find((d) => d.id === id)?.name || "—";
  const branchName = (id) => branches.find((b) => b.id === id)?.name || "—";

  const kpis = useMemo(() => {
    const total = tasks.length || 1;
    const done = tasks.filter((t) => t.status === "done").length;
    const nonCompliant = tasks.filter((t) => t.status === "non_compliant").length;
    const late = tasks.filter((t) => t.status === "late").length;
    const openNotes = corrective.filter((c) => c.status !== "closed").length;
    const completion = Math.round((done / total) * 100);
    const quality = Math.max(0, Math.min(100, completion - nonCompliant * 8));

    const reviewable = tasks.filter((t) => t.status === "done" || t.status === "non_compliant");
    const verifiedCount = reviewable.filter((t) => t.verified).length;
    const approvalRate = reviewable.length ? Math.round((verifiedCount / reviewable.length) * 100) : null;

    const closedWithTimes = corrective.filter((c) => c.status === "closed" && c.openedAt && c.closedAt);
    const avgCorrectiveMinutes = closedWithTimes.length
      ? Math.round(closedWithTimes.reduce((sum, c) => sum + (c.closedAt - c.openedAt) / 60000, 0) / closedWithTimes.length)
      : null;

    return { completion, quality, late, openNotes, approvalRate, avgCorrectiveMinutes };
  }, [tasks, corrective]);

  function addTask({ title, departmentId, time, assignedTo, standardLabel, day, shift }) {
    setTasks((prev) => [
      ...prev,
      { id: nextId("t"), title, departmentId, time, assignedTo, standardLabel: standardLabel || "—",
        day, shift, unit: null, status: "not_started", result: "", note: "", completedAt: null,
        completedDateKey: null, verified: false, photo: null },
    ]);
    setShowAddTask(false);
  }

  function addEmployee({ name, title, role, pin, shift, supervisorId, branchId }) {
    const id = nextId("u");
    setEmployees((prev) => [...prev, { id, name, title, role, pin, shift, supervisorId, branchId }]);
    setShowAddUser(false);
  }

  function removeEmployee(id) {
    setEmployees((prev) => prev.filter((e) => e.id !== id));
  }

  function addDepartment(name, branchId) {
    setDepartments((prev) => [...prev, { id: nextId("d"), name, branchId }]);
  }

  function updateDepartment(id, name) {
    setDepartments((prev) => prev.map((d) => (d.id === id ? { ...d, name } : d)));
  }

  function removeDepartment(id) {
    setDepartments((prev) => prev.filter((d) => d.id !== id));
  }

  function addBranch(name) {
    setBranches((prev) => [...prev, { id: nextId("b"), name }]);
  }

  function updateBranch(id, name) {
    setBranches((prev) => prev.map((b) => (b.id === id ? { ...b, name } : b)));
  }

  function removeBranch(id) {
    setBranches((prev) => prev.filter((b) => b.id !== id));
  }

  function updateUserPermission(userId, role, tabId, value) {
    setPermissions((prev) => {
      const current = prev.users?.[userId] || DEFAULT_PERMS_BY_ROLE[role] || {};
      return { ...prev, users: { ...prev.users, [userId]: { ...current, [tabId]: value } } };
    });
  }

  function removeTask(id) {
    setTasks((prev) => prev.filter((t) => t.id !== id));
  }

  function submitTaskResult(taskId, { result, compliant, note, photo }) {
    const now = new Date().toLocaleTimeString("ar-SA", { hour: "2-digit", minute: "2-digit" });
    setTasks((prev) =>
      prev.map((t) =>
        t.id === taskId
          ? { ...t, result, status: compliant ? "done" : "non_compliant", note, completedAt: now, completedDateKey: todayKey(), verified: false, photo }
          : t
      )
    );
    if (!compliant) {
      setCorrective((prev) => [
        ...prev,
        { id: nextId("c"), taskId, title: tasks.find((t) => t.id === taskId)?.title, note,
          responsible: employeeName(tasks.find((t) => t.id === taskId)?.assignedTo),
          due: "اليوم — 2:00 م", status: "open", openedAt: Date.now(), closedAt: null },
      ]);
    }
    setOpenTask(null);
  }

  function verifyTask(taskId) {
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, verified: true } : t)));
  }

  function closeCorrective(id) {
    setCorrective((prev) => prev.map((c) => (c.id === id ? { ...c, status: "closed", closedAt: Date.now() } : c)));
  }

  function addHREmployee({ name, title, branchId, nationality, mobile, iqamaNumber, iqamaExpiry, healthExpiry }) {
    const id = nextId("u");
    setEmployees((prev) => [...prev, {
      id, name, title, role: "employee", pin: null, shift: null, supervisorId: null, branchId,
      nationality, mobile, iqamaNumber, iqamaExpiry, healthExpiry,
    }]);
  }
  function updateHREmployee(id, patch) {
    setEmployees((prev) => prev.map((e) => e.id === id ? { ...e, ...patch } : e));
  }
  function removeHREmployee(id) {
    setEmployees((prev) => prev.filter((e) => e.id !== id));
  }

  function addGuideItem(categoryId, item) {
    setGuidelines((prev) => prev.map((c) => c.id === categoryId ? { ...c, items: [...c.items, { id: nextGId(), ...item }] } : c));
  }
  function updateGuideItem(categoryId, itemId, patch) {
    setGuidelines((prev) => prev.map((c) => c.id !== categoryId ? c : {
      ...c, items: c.items.map((it) => it.id === itemId ? { ...it, ...patch } : it),
    }));
  }
  function removeGuideItem(categoryId, itemId) {
    setGuidelines((prev) => prev.map((c) => c.id !== categoryId ? c : { ...c, items: c.items.filter((it) => it.id !== itemId) }));
  }
  function addGuideCategory(title, icon) {
    setGuidelines((prev) => [...prev, { id: nextGId(), title, icon: icon || "📌", color: "#2DD4BF", items: [] }]);
  }

  return (
    <div dir="rtl" style={{ fontFamily: "'Cairo', sans-serif" }} className="min-h-screen w-full bg-slate-950 text-slate-100">
      <style>{FONT_IMPORT}</style>
      <style>{PRINT_CSS}</style>

      {module === null && <ModuleSelector onSelect={setModule} />}

      {module === "hr" && (
        hrRole === null ? (
          <HRLoginScreen onLogin={setHrRole} onBack={() => setModule(null)} />
        ) : (
          <HRModule employees={employees} branches={branches} role={hrRole}
            onBack={() => { setModule(null); setHrRole(null); }}
            onSwitchUser={() => setHrRole(null)}
            onAdd={addHREmployee} onUpdate={updateHREmployee} onRemove={removeHREmployee} />
        )
      )}

      {module === "guides" && (
        <GuidelinesModule guidelines={guidelines} onBack={() => setModule(null)}
          onAddItem={addGuideItem} onUpdateItem={updateGuideItem} onRemoveItem={removeGuideItem}
          onAddCategory={addGuideCategory} />
      )}

      {module === "ops" && (!currentUser ? (
        <LoginScreen employees={employees} onLogin={handleLogin} onBack={() => setModule(null)} />
      ) : (
        <>
          <TopBar user={currentUser} onSave={saveNow} onLogout={async () => { await saveNow(); setCurrentUserId(null); }} />

          {(currentUser.role === "admin" || currentUser.role === "manager") && (
            <AdminDashboard
              role={currentUser.role} perms={getUserPerms(permissions, currentUser.id, currentUser.role)} permissions={permissions}
              tab={adminTab} setTab={setAdminTab}
              employees={employees} tasks={tasks} corrective={corrective} kpis={kpis}
              departments={departments} branches={branches}
              employeeName={employeeName} departmentName={departmentName} branchName={branchName}
              onAddTask={() => setShowAddTask(true)}
              onRemoveTask={removeTask}
              onAddUser={() => setShowAddUser(true)}
              onRemoveEmployee={removeEmployee}
              onCloseCorrective={closeCorrective}
              onAddDepartment={addDepartment}
              onUpdateDepartment={updateDepartment}
              onRemoveDepartment={removeDepartment}
              onAddBranch={addBranch}
              onUpdateBranch={updateBranch}
              onRemoveBranch={removeBranch}
              onUpdatePermission={updateUserPermission}
            />
          )}

          {currentUser.role === "supervisor" && (
            <ExtraAccessShell user={currentUser} permissions={permissions}
              tasks={tasks} employees={employees} corrective={corrective} kpis={kpis}
              departments={departments} branches={branches}
              employeeName={employeeName} departmentName={departmentName} branchName={branchName}
              onCloseCorrective={closeCorrective}>
              <SupervisorDashboard
                user={currentUser}
                employees={employees}
                tasks={tasks} corrective={corrective} employeeName={employeeName}
                departmentName={departmentName}
                onCloseCorrective={closeCorrective}
                onVerifyTask={verifyTask}
                onOpenTask={(t) => setOpenTask(t)}
              />
            </ExtraAccessShell>
          )}

          {currentUser.role === "employee" && (
            <ExtraAccessShell user={currentUser} permissions={permissions}
              tasks={tasks} employees={employees} corrective={corrective} kpis={kpis}
              departments={departments} branches={branches}
              employeeName={employeeName} departmentName={departmentName} branchName={branchName}
              onCloseCorrective={closeCorrective}>
              <EmployeeApp user={currentUser} tasks={tasks} departmentName={departmentName} onOpenTask={(t) => setOpenTask(t)} />
            </ExtraAccessShell>
          )}
        </>
      ))}

      {showAddTask && (
        <AddTaskModal employees={employees.filter(e => e.role !== "admin" && e.role !== "manager")} departments={departments}
          onClose={() => setShowAddTask(false)} onSubmit={addTask} />
      )}
      {showAddUser && <AddUserModal employees={employees} branches={branches} onClose={() => setShowAddUser(false)} onSubmit={addEmployee} />}
      {openTask && (
        <TaskExecuteModal task={openTask} departmentName={departmentName} onClose={() => setOpenTask(null)} onSubmit={submitTaskResult} />
      )}
    </div>
  );
}

function HRLoginScreen({ onLogin, onBack }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  function press(d) {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next);
    setError("");
    if (next.length === 4) {
      const match = HR_ROLES_SEED.find((r) => r.pin === next);
      if (match) {
        setTimeout(() => onLogin(match.role), 150);
      } else {
        setTimeout(() => { setError("رقم سري غير صحيح"); setPin(""); }, 300);
      }
    }
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 relative">
      <button onClick={onBack} className="absolute top-5 right-5 text-xs text-slate-500 hover:text-teal-400 flex items-center gap-1">
        <span>→</span> الوحدات
      </button>
      <div className="w-14 h-14 rounded-full border-[3px] border-teal-400 flex items-center justify-center mb-3">
        <Users size={26} className="text-teal-400" />
      </div>
      <div className="font-extrabold text-xl mb-1 tracking-tight">CHECKFLOW</div>
      <div className="text-xs text-teal-400 font-bold mb-1">شؤون الموظفين</div>
      <div className="text-sm text-teal-600/80 mb-10">أدخل رقمك السري للدخول</div>

      <div className="flex gap-3 mb-3">
        {[0, 1, 2, 3].map((i) => (
          <div key={i} className={`w-4 h-4 rounded-full border-2 ${pin.length > i ? "bg-teal-400 border-teal-400" : "border-slate-700"}`} />
        ))}
      </div>
      <div className="h-5 text-xs text-red-400 mb-4">{error}</div>

      <div className="grid grid-cols-3 gap-4">
        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => (
          <button key={n} onClick={() => press(String(n))}
            className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold hover:bg-slate-800 active:scale-95 transition">
            {n}
          </button>
        ))}
        <div />
        <button onClick={() => press("0")}
          className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold hover:bg-slate-800 active:scale-95 transition">
          0
        </button>
        <button onClick={() => setPin(pin.slice(0, -1))} className="w-16 h-16 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-300">
          <Delete size={20} />
        </button>
      </div>

      <div className="mt-10 text-xs text-slate-600 text-center leading-6">
        للتجربة — تصفح فقط: 1234 &nbsp;·&nbsp; HR (كل الصلاحيات): 9090
      </div>
    </div>
  );
}

function HRModule({ employees, branches, role, onBack, onSwitchUser, onAdd, onUpdate, onRemove }) {
  const canEdit = role === "hr_admin";
  const [query, setQuery] = useState("");
  const [openEmp, setOpenEmp] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [editingEmp, setEditingEmp] = useState(null);
  const branchName = (id) => branches.find((b) => b.id === id)?.name || "—";

  const enriched = useMemo(() => employees.map((e) => {
    const iqamaDays = hrDaysUntil(e.iqamaExpiry);
    const healthDays = hrDaysUntil(e.healthExpiry);
    return {
      ...e,
      iqamaDays, healthDays,
      iqamaStatus: hrStatusFromDays(iqamaDays),
      healthStatus: hrStatusFromDays(healthDays),
    };
  }), [employees]);

  const filtered = useMemo(() => {
    const q = query.trim();
    if (!q) return enriched;
    return enriched.filter((e) => e.name.includes(q) || empCode(e.id).toLowerCase().includes(q.toLowerCase()));
  }, [enriched, query]);

  const attention = useMemo(() =>
    enriched
      .filter((e) => e.iqamaStatus.key !== "active" && e.iqamaStatus.key !== "na" || e.healthStatus.key !== "active" && e.healthStatus.key !== "na")
      .map((e) => {
        const worst = [
          { type: "الإقامة", days: e.iqamaDays, status: e.iqamaStatus },
          { type: "البطاقة الصحية", days: e.healthDays, status: e.healthStatus },
        ].filter((x) => x.status.key === "expired" || x.status.key === "soon")
         .sort((a, b) => a.days - b.days)[0];
        return { emp: e, worst };
      })
      .filter((x) => x.worst)
      .sort((a, b) => a.worst.days - b.worst.days)
  , [enriched]);

  const kpi = useMemo(() => {
    const total = enriched.length;
    const expiredCount = enriched.filter((e) => e.iqamaStatus.key === "expired" || e.healthStatus.key === "expired").length;
    const soonCount = enriched.filter((e) => e.iqamaStatus.key === "soon" || e.healthStatus.key === "soon").length;
    const okCount = total - expiredCount - soonCount;
    return { total, expiredCount, soonCount, okCount };
  }, [enriched]);

  return (
    <div className="min-h-screen w-full max-w-lg mx-auto px-4 pb-10">
      <div className="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-teal-900/40 -mx-4 px-4 py-3 mb-4 flex items-center justify-between">
        <button onClick={onBack} className="text-xs text-slate-500 hover:text-teal-400 flex items-center gap-1">
          <span>→</span> الوحدات
        </button>
        <div className="flex items-center gap-2">
          <button onClick={onSwitchUser} className="text-[10px] font-bold px-2 py-1 rounded-full border border-slate-800 text-slate-400 hover:border-teal-500 hover:text-teal-400">
            {canEdit ? "HR" : "تصفح"} ↻
          </button>
          <div className="font-extrabold text-sm">شؤون الموظفين</div>
          <div className="w-7 h-7 rounded-full border-2 border-teal-400 flex items-center justify-center">
            <CheckCircle2 size={14} className="text-teal-400" />
          </div>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-2 mb-4">
        {[
          { label: "الإجمالي", value: kpi.total, color: "#5EEAD4" },
          { label: "سارية", value: kpi.okCount, color: "#34D399" },
          { label: "قريبة", value: kpi.soonCount, color: "#FBBF24" },
          { label: "منتهية", value: kpi.expiredCount, color: "#F87171" },
        ].map((c) => (
          <div key={c.label} className="bg-slate-900 border border-slate-800 rounded-xl py-3 text-center">
            <div className="text-lg font-extrabold" style={{ color: c.color }}>{c.value}</div>
            <div className="text-[10px] text-slate-500 mt-0.5">{c.label}</div>
          </div>
        ))}
      </div>

      {attention.length > 0 && (
        <div className="mb-5">
          <div className="text-xs font-bold text-amber-400 mb-2">يحتاج انتباه</div>
          <div className="space-y-2">
            {attention.map(({ emp, worst }) => (
              <button key={emp.id} onClick={() => setOpenEmp(emp)}
                className="w-full text-right rounded-xl border border-slate-800 bg-slate-900/60 p-3.5 flex items-center justify-between">
                <div>
                  <div className="font-bold text-sm mb-1">{emp.name}</div>
                  <div className="text-xs text-slate-500">{worst.type} · {emp.title}</div>
                </div>
                <span className="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0" style={{ color: worst.status.color, background: worst.status.bg }}>
                  {worst.status.label}
                </span>
              </button>
            ))}
          </div>
        </div>
      )}

      <div className="mb-3">
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث بالاسم أو الرقم الوظيفي (EMP-001)"
          className="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none focus:border-teal-500" />
      </div>

      {canEdit && (
        <button onClick={() => setShowAdd(true)}
          className="w-full flex items-center justify-center gap-1.5 bg-teal-400 text-slate-950 text-sm font-bold py-2.5 rounded-xl mb-4">
          <Plus size={16} /> إضافة موظف جديد
        </button>
      )}

      <div className="space-y-2">
        {filtered.map((e) => (
          <button key={e.id} onClick={() => setOpenEmp(e)}
            className="w-full text-right rounded-xl border border-slate-800 bg-slate-900/60 p-3.5">
            <div className="flex items-center justify-between mb-1.5">
              <div className="font-bold text-sm">{e.name}</div>
              <span className="text-[10px] text-slate-500">{empCode(e.id)}</span>
            </div>
            <div className="text-xs text-slate-500 mb-2">{e.title} · {branchName(e.branchId)}</div>
            <div className="flex gap-1.5">
              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ color: e.iqamaStatus.color, background: e.iqamaStatus.bg }}>
                إقامة: {e.iqamaStatus.label}
              </span>
              <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ color: e.healthStatus.color, background: e.healthStatus.bg }}>
                صحية: {e.healthStatus.label}
              </span>
            </div>
          </button>
        ))}
        {filtered.length === 0 && (
          <div className="text-center text-sm text-slate-600 py-10">لا يوجد موظف مطابق</div>
        )}
      </div>

      {showAdd && (
        <AddHREmployeeModal branches={branches} onClose={() => setShowAdd(false)}
          onSubmit={(data) => { onAdd(data); setShowAdd(false); }} />
      )}

      {openEmp && (
        <div className="fixed inset-0 z-40 bg-black/60 flex items-end sm:items-center justify-center" onClick={() => setOpenEmp(null)}>
          <div className="bg-slate-950 border border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <div className="font-extrabold text-lg">{openEmp.name}</div>
              <button onClick={() => setOpenEmp(null)} className="text-slate-500 hover:text-slate-300"><X size={18} /></button>
            </div>
            <div className="space-y-2.5 text-sm">
              {[
                ["الرقم الوظيفي", empCode(openEmp.id)],
                ["المسمى الوظيفي", openEmp.title],
                ["الفرع", branchName(openEmp.branchId)],
                ["الجنسية", openEmp.nationality],
                ["رقم الجوال", openEmp.mobile],
                ["رقم الإقامة", openEmp.iqamaNumber || "لا ينطبق"],
              ].map(([label, value]) => (
                <div key={label} className="flex items-center justify-between border-b border-slate-900 pb-2.5">
                  <span className="text-slate-500">{label}</span>
                  <span className="font-bold">{value}</span>
                </div>
              ))}
              <div className="flex items-center justify-between border-b border-slate-900 pb-2.5">
                <span className="text-slate-500">تاريخ انتهاء الإقامة</span>
                <span className="font-bold flex items-center gap-2">
                  {hrFmtDate(openEmp.iqamaExpiry)}
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ color: openEmp.iqamaStatus.color, background: openEmp.iqamaStatus.bg }}>
                    {openEmp.iqamaStatus.label}
                  </span>
                </span>
              </div>
              <div className="flex items-center justify-between pb-1">
                <span className="text-slate-500">تاريخ انتهاء البطاقة الصحية</span>
                <span className="font-bold flex items-center gap-2">
                  {hrFmtDate(openEmp.healthExpiry)}
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ color: openEmp.healthStatus.color, background: openEmp.healthStatus.bg }}>
                    {openEmp.healthStatus.label}
                  </span>
                </span>
              </div>
            </div>
            {canEdit && (
              <div className="flex gap-2 mt-4">
                <button onClick={() => { setEditingEmp(openEmp); setOpenEmp(null); }}
                  className="flex-1 flex items-center justify-center gap-1.5 border border-slate-800 text-slate-300 text-sm font-bold py-2.5 rounded-xl">
                  <Pencil size={14} /> تعديل
                </button>
                <button onClick={() => { if (confirm(`حذف ${openEmp.name}؟`)) { onRemove(openEmp.id); setOpenEmp(null); } }}
                  className="flex-1 flex items-center justify-center gap-1.5 border border-red-900 text-red-400 text-sm font-bold py-2.5 rounded-xl">
                  <Trash2 size={14} /> حذف
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {editingEmp && (
        <AddHREmployeeModal branches={branches} initial={editingEmp} onClose={() => setEditingEmp(null)}
          onSubmit={(data) => { onUpdate(editingEmp.id, data); setEditingEmp(null); }} />
      )}
    </div>
  );

// ---------------- Login (PIN) ----------------

function LoginScreen({ employees, onLogin, onBack }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  function press(d) {
    if (pin.length >= 4) return;
    const next = pin + d;
    setPin(next);
    setError("");
    if (next.length === 4) {
      const match = employees.find((e) => e.pin === next);
      if (match) {
        setTimeout(() => onLogin(match.id), 150);
      } else {
        setTimeout(() => {
          setError("رقم سري غير صحيح");
          setPin("");
        }, 300);
      }
    }
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 relative">
      {onBack && (
        <button onClick={onBack} className="absolute top-5 right-5 text-xs text-slate-500 hover:text-teal-400 flex items-center gap-1">
          <span>→</span> الوحدات
        </button>
      )}
      <div className="w-14 h-14 rounded-full border-[3px] border-teal-400 flex items-center justify-center mb-3">
        <CheckCircle2 size={26} className="text-teal-400" />
      </div>
      <div className="font-extrabold text-xl mb-1 tracking-tight">CHECKFLOW</div>
      <div className="text-xs text-teal-400 font-bold mb-1">قسم التشغيل</div>
      <div className="text-sm text-teal-600/80 mb-10">أدخل رقمك السري للدخول</div>

      <div className="flex gap-3 mb-3">
        {[0, 1, 2, 3].map((i) => (
          <div
            key={i}
            className={`w-4 h-4 rounded-full border-2 ${
              pin.length > i ? "bg-teal-400 border-teal-400" : "border-slate-700"
            }`}
          />
        ))}
      </div>
      <div className="h-5 text-xs text-red-400 mb-4">{error}</div>

      <div className="grid grid-cols-3 gap-4">
        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => (
          <button
            key={n}
            onClick={() => press(String(n))}
            className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold hover:bg-slate-800 active:scale-95 transition"
          >
            {n}
          </button>
        ))}
        <div />
        <button
          onClick={() => press("0")}
          className="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 text-xl font-bold hover:bg-slate-800 active:scale-95 transition"
        >
          0
        </button>
        <button
          onClick={() => setPin(pin.slice(0, -1))}
          className="w-16 h-16 rounded-full flex items-center justify-center text-slate-500 hover:text-slate-300"
        >
          <Delete size={20} />
        </button>
      </div>

      <div className="mt-10 text-xs text-slate-600 text-center leading-6">
        للتجربة — الرياض: مالك 1111 · مدير 9999 · مشرف 2222 · موظف 3333 / 4444<br />
        جدة: مشرف 5555 · موظف 6666 &nbsp;·&nbsp; الدمام: مشرف 7777 · موظف 8888
      </div>
    </div>
  );
}

// ---------------- Top bar ----------------

function TopBar({ user, onLogout, onSave }) {
  const [saveState, setSaveState] = useState("idle"); // idle | saving | done

  async function handleSave() {
    setSaveState("saving");
    const ok = await onSave();
    setSaveState(ok ? "done" : "idle");
    if (ok) setTimeout(() => setSaveState("idle"), 1500);
  }

  return (
    <div className="sticky top-0 z-30 border-b border-teal-900/40 bg-slate-950/90 backdrop-blur px-5 py-3 flex items-center justify-between">
      <div className="flex items-center gap-2">
        <div className="w-8 h-8 rounded-full border-[2.5px] border-teal-400 flex items-center justify-center">
          <CheckCircle2 size={16} className="text-teal-400" />
        </div>
        <div>
          <div className="font-extrabold text-[15px] leading-none tracking-tight">CHECKFLOW</div>
          <div className="text-[11px] text-teal-600/80 leading-none mt-1">نظام التشغيل الرقمي</div>
        </div>
      </div>

      <div className="flex items-center gap-3">
        <button onClick={handleSave} disabled={saveState === "saving"}
          className={`text-[11px] font-bold px-3 py-1.5 rounded-full border transition-colors ${
            saveState === "done" ? "border-teal-400 text-teal-300 bg-teal-950" : "border-slate-800 text-slate-400 hover:text-teal-300"
          }`}>
          {saveState === "saving" ? "جارِ الحفظ..." : saveState === "done" ? "✓ تم الحفظ" : "💾 حفظ"}
        </button>
        <div className="text-left">
          <div className="text-xs font-bold leading-none">{user.name}</div>
          <div className="text-[10px] text-slate-500 leading-none mt-1">{ROLE_LABEL[user.role]}</div>
        </div>
        <button onClick={onLogout} className="text-slate-500 hover:text-red-400 p-1.5">
          <LogOut size={17} />
        </button>
      </div>
    </div>
  );
}

// ---------------- Admin dashboard ----------------

function AdminDashboard({
  role, perms, permissions, tab, setTab, employees, tasks, corrective, kpis, departments, branches,
  employeeName, departmentName, branchName,
  onAddTask, onRemoveTask, onAddUser, onRemoveEmployee, onCloseCorrective,
  onAddDepartment, onUpdateDepartment, onRemoveDepartment,
  onAddBranch, onUpdateBranch, onRemoveBranch, onUpdatePermission,
}) {
  const [branchFilter, setBranchFilter] = useState("all");
  const isManager = role === "manager";
  const canSee = (tabId) => role === "admin" || !!perms?.[tabId];

  const ICONS = { overview: LayoutGrid, tasks: ListChecks, departments: Layers, branches: Building2, users: Users, reports: FileBarChart };
  let tabs = ADMIN_TABS_META.filter((t) => canSee(t.id)).map((t) => ({ ...t, icon: ICONS[t.id] }));
  if (role === "admin") tabs = [...tabs, { id: "permissions", label: "الصلاحيات", icon: Pencil }];

  // if current tab got hidden (e.g. permission revoked), fall back to the first visible tab
  const activeTab = tabs.some((t) => t.id === tab) ? tab : (tabs[0]?.id || "overview");

  const filteredDepartments = branchFilter === "all" ? departments : departments.filter((d) => d.branchId === branchFilter);
  const filteredEmployees = branchFilter === "all" ? employees : employees.filter((e) => e.role === "admin" || e.branchId === branchFilter);
  const branchDeptIds = new Set(filteredDepartments.map((d) => d.id));
  const filteredTasks = branchFilter === "all" ? tasks : tasks.filter((t) => branchDeptIds.has(t.departmentId));

  const showBranchFilter = ["tasks", "departments", "users"].includes(activeTab) && branches.length > 1;

  return (
    <div className="flex max-w-6xl mx-auto">
      <aside className="w-56 shrink-0 hidden md:block border-l border-slate-900 min-h-[calc(100vh-61px)] py-6 px-3">
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = activeTab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm mb-1 transition-colors ${
                active ? "bg-teal-950 text-teal-300 font-bold" : "text-slate-400 hover:bg-slate-900"
              }`}>
              <Icon size={17} />
              {t.label}
            </button>
          );
        })}
      </aside>

      <div className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-slate-950 border-t border-slate-900 flex justify-around py-2 overflow-x-auto">
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = activeTab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex flex-col items-center gap-1 px-2">
              <Icon size={18} className={active ? "text-teal-400" : "text-slate-500"} />
              <span className={`text-[10px] ${active ? "text-teal-400" : "text-slate-500"}`}>{t.label}</span>
            </button>
          );
        })}
      </div>

      <main className="flex-1 px-5 py-6 pb-24 md:pb-6">
        {showBranchFilter && (
          <div className="flex flex-wrap gap-2 mb-5">
            <button onClick={() => setBranchFilter("all")}
              className={`text-xs px-3 py-1.5 rounded-full border ${branchFilter === "all" ? "bg-teal-400 text-slate-950 font-bold border-teal-400" : "border-slate-800 text-slate-400"}`}>
              كل الفروع
            </button>
            {branches.map((b) => (
              <button key={b.id} onClick={() => setBranchFilter(b.id)}
                className={`text-xs px-3 py-1.5 rounded-full border ${branchFilter === b.id ? "bg-teal-400 text-slate-950 font-bold border-teal-400" : "border-slate-800 text-slate-400"}`}>
                {b.name}
              </button>
            ))}
          </div>
        )}
        {activeTab === "overview" && <OverviewTab kpis={kpis} tasks={tasks} corrective={corrective} />}
        {activeTab === "tasks" && <TasksTab tasks={filteredTasks} employeeName={employeeName} departmentName={departmentName} onAddTask={onAddTask} onRemoveTask={onRemoveTask} />}
        {activeTab === "departments" && (
          <DepartmentsTab departments={filteredDepartments} branches={branches} branchFilter={branchFilter} tasks={tasks}
            onAdd={onAddDepartment} onUpdate={onUpdateDepartment} onRemove={onRemoveDepartment} />
        )}
        {activeTab === "branches" && (
          <BranchesTab branches={branches} departments={departments} tasks={tasks} corrective={corrective}
            readOnly={isManager} onAdd={onAddBranch} onUpdate={onUpdateBranch} onRemove={onRemoveBranch} />
        )}
        {activeTab === "users" && (
          <UsersTab employees={filteredEmployees} tasks={tasks} branchName={branchName} readOnly={isManager} onAddUser={onAddUser} onRemove={onRemoveEmployee} />
        )}
        {activeTab === "reports" && (
          <ReportsTab kpis={kpis} tasks={tasks} employees={employees} corrective={corrective}
            employeeName={employeeName} departmentName={departmentName} onCloseCorrective={onCloseCorrective} />
        )}
        {activeTab === "permissions" && role === "admin" && (
          <PermissionsTab employees={employees} permissions={permissions} onUpdate={onUpdatePermission} />
        )}
      </main>
    </div>
  );
}

              return (

                  <div>
                    <span className="text-sm font-bold">{t.label}</span>
                    {(t.id === "branches" || t.id === "users") && (
                      <span className="text-[10px] text-slate-500 block mt-0.5">عرض فقط دائماً — بدون إضافة أو تعديل أو حذف</span>

                    onClick={() => onUpdate(selected.id, selected.role, t.id, !checked)}

                    style={{ width: "3rem", height: "1.6rem" }}>
                    <span className="absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all"
                      style={{ right: checked ? "1.55rem" : "0.15rem" }} />

            })}

          <p className="text-xs text-slate-500 mt-4">
            {selected.role === "manager"
              ? "المدير يدير المهام والأقسام بشكل طبيعي إذا فعّلتها له — الفروع والمستخدمون عرض فقط دائماً."
              : "أي قسم تفعّله هون بيظهر لهذا الشخص كعرض إضافي جنب لوحته الأساسية، بدون صلاحية إدارة."}
          </p>
        </>
      )}
    </div>
  );
}

function SupervisorDashboard({ user, employees, tasks, corrective, employeeName, departmentName, onCloseCorrective, onVerifyTask, onOpenTask }) {

  const teamTasks = tasks.filter((t) => teamIds.includes(t.assignedTo));
  const teamCorrective = corrective.filter((c) => teamIds.includes(tasks.find((t) => t.id === c.taskId)?.assignedTo));
  const needsReview = teamTasks.filter((t) => (t.status === "done" || t.status === "non_compliant") && !t.verified);

  const myTasks = tasks.filter((t) => t.assignedTo === user.id);
  const myPending = myTasks.filter((t) => t.status !== "done" && t.status !== "non_compliant");
  const myDone = myTasks.filter((t) => t.status === "done" || t.status === "non_compliant");

  return (
    <div className="max-w-2xl mx-auto px-5 py-6">

            <ClipboardList size={15} /> مهامي الشخصية ({myPending.length} معلّقة)
          </div>

              return (
                <button key={t.id} disabled={!clickable} onClick={() => clickable && onOpenTask(t)}

                      {meta.label}

function branchStatusMeta(completion) {
  if (completion >= 90) return { label: "ممتاز", color: "#34D399" };
  if (completion >= 80) return { label: "جيد", color: "#2DD4BF" };
  if (completion >= 70) return { label: "بحاجة متابعة", color: "#FBBF24" };
  return { label: "أولوية", color: "#F87171" };
}

function BranchesTab({ branches, departments, tasks, corrective, readOnly, onAdd, onUpdate, onRemove }) {
  const [newName, setNewName] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editValue, setEditValue] = useState("");

  function startEdit(b) {
    setEditingId(b.id);
    setEditValue(b.name);
  }
  function saveEdit() {
    if (editValue.trim()) onUpdate(editingId, editValue.trim());
    setEditingId(null);
  }

  const rows = branches.map((b) => {
    const deptIds = new Set(departments.filter((d) => d.branchId === b.id).map((d) => d.id));
    const bTasks = tasks.filter((t) => deptIds.has(t.departmentId));
    const total = bTasks.length || 1;
    const done = bTasks.filter((t) => t.status === "done").length;
    const nonCompliant = bTasks.filter((t) => t.status === "non_compliant").length;
    const completion = Math.round((done / total) * 100);
    const quality = Math.max(0, Math.min(100, completion - nonCompliant * 8));
    const openNotes = corrective.filter((c) => c.status !== "closed" && bTasks.some((t) => t.id === c.taskId)).length;
    const deptCount = deptIds.size;
    return { ...b, completion, quality, openNotes, deptCount, hasTasks: bTasks.length > 0, ...branchStatusMeta(completion) };
  });

  return (
    <div>
      <h1 className="text-xl font-extrabold mb-1">الفروع</h1>
      <p className="text-sm text-slate-400 mb-5">
        {readOnly ? "مقارنة أداء الفروع (وضع العرض فقط)" : "قارن أداء الفروع، وأضف فروعاً جديدة كلما توسّعت المنشأة"}
      </p>

      {!readOnly && (
        <div className="flex gap-2 mb-6">
          <input className={inputCls} value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="اسم فرع جديد، مثال: الخبر" />
          <button
            disabled={!newName.trim()}
            onClick={() => { onAdd(newName.trim()); setNewName(""); }}
            className="shrink-0 flex items-center gap-1.5 bg-teal-400 disabled:opacity-40 text-slate-950 text-sm font-bold px-4 rounded-xl">
            <Plus size={16} /> إضافة فرع
          </button>
        </div>
      )}

      <div className="rounded-2xl border border-slate-900 bg-slate-900/40 overflow-hidden mb-6">
        <div className="grid grid-cols-5 gap-2 px-4 py-3 text-[11px] text-slate-500 border-b border-slate-900">
          <span>الفرع</span><span>الالتزام</span><span>الجودة</span><span>الملاحظات</span><span>الحالة</span>
        </div>
        {rows.map((r) => (
          <div key={r.id} className="grid grid-cols-5 gap-2 px-4 py-3 items-center text-sm border-b border-slate-900/60 last:border-0">
            {editingId === r.id ? (
              <input className={inputCls} value={editValue} autoFocus
                onChange={(e) => setEditValue(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveEdit()} />
            ) : (
              <span className="font-bold flex items-center gap-1.5">
                {r.name}
                {!readOnly && (
                  <button onClick={() => startEdit(r)} className="text-slate-600 hover:text-teal-300"><Pencil size={12} /></button>
                )}
              </span>
            )}
            <span className="text-slate-300">{r.hasTasks ? `${r.completion}%` : "—"}</span>
            <span className="text-slate-300">{r.hasTasks ? `${r.quality}%` : "—"}</span>
            <span className="text-slate-300">{r.openNotes}</span>
            {r.hasTasks ? (
              <span className="text-xs font-bold px-2.5 py-1 rounded-full w-fit" style={{ color: r.color, background: `${r.color}20` }}>{r.label}</span>
            ) : (
              <span className="text-xs text-slate-600">لا توجد بيانات</span>
            )}
          </div>
        ))}
      </div>

      {!readOnly && (
        <div className="space-y-2">
          {rows.map((r) => (
            <div key={r.id} className="flex items-center justify-between text-xs text-slate-500 px-1">
              <span>{r.name} · {r.deptCount} قسم</span>
              {r.deptCount === 0 && (
                <button onClick={() => onRemove(r.id)} className="text-slate-600 hover:text-red-400 flex items-center gap-1">
                  <Trash2 size={12} /> حذف الفرع
                </button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TrendChart({ points }) {
  const w = 320, h = 90, pad = 10;
  const n = points.length;
  const xAt = (i) => pad + (i * (w - pad * 2)) / (n - 1);
  const yAt = (v) => h - pad - (v / 100) * (h - pad * 2);

  const linePath = (key, color) => {
    const d = points.map((p, i) => `${i === 0 ? "M" : "L"} ${xAt(i)} ${yAt(p[key])}`).join(" ");
    return <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />;
  };

  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
        {[25, 50, 75].map((v) => (
          <line key={v} x1={pad} x2={w - pad} y1={yAt(v)} y2={yAt(v)} stroke="#1e293b" strokeWidth="1" />
        ))}
        {linePath("completion", "#2DD4BF")}
        {linePath("quality", "#34D399")}
        {points.map((p, i) => (
          <g key={i}>
            <circle cx={xAt(i)} cy={yAt(p.completion)} r="3" fill="#2DD4BF" />
            <circle cx={xAt(i)} cy={yAt(p.quality)} r="3" fill="#34D399" />
          </g>
        ))}
      </svg>
      <div className="flex items-center justify-between mt-1">
        {points.map((p, i) => (
          <span key={i} className="text-[10px] text-slate-500">{p.label}</span>
        ))}
      </div>
      <div className="flex items-center gap-4 mt-2">
        <span className="flex items-center gap-1.5 text-[11px] text-slate-400"><span className="w-2 h-2 rounded-full bg-teal-400" /> نسبة الإنجاز</span>
        <span className="flex items-center gap-1.5 text-[11px] text-slate-400"><span className="w-2 h-2 rounded-full bg-emerald-400" /> الجودة</span>
      </div>
    </div>
  );
}

                {r.name}
                {r.note && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ color: r.noteColor, background: `${r.noteColor}20` }}>

function ReportsTab({ kpis, tasks, employees, corrective, employeeName, departmentName, onCloseCorrective }) {
  const [drill, setDrill] = useState(null); // { title, list }
  const [viewTask, setViewTask] = useState(null);

  const attention = tasks.filter((t) => t.status === "non_compliant" || t.status === "late");
  const trendPoints = [...HISTORY_SEED, { label: "اليوم", completion: kpis.completion, quality: kpis.quality }];

  function rowNote(rowTasks) {
    const late = rowTasks.filter((t) => t.status === "late").length;
    const nonCompliant = rowTasks.filter((t) => t.status === "non_compliant").length;
    const incomplete = rowTasks.filter((t) => t.status === "not_started" || t.status === "in_progress").length;
    if (late > 0) return { note: "متأخر", noteColor: "#FBBF24" };
    if (nonCompliant > 0) return { note: "غير مطابق", noteColor: "#F87171" };
    if (incomplete > 0) return { note: "غير مكتمل", noteColor: "#7C9A95" };
    return { note: null, noteColor: null };
  }

  const employeeRows = employees
    .filter((e) => e.role !== "admin")
    .map((e) => {
      const eTasks = tasks.filter((t) => t.assignedTo === e.id);
      const done = eTasks.filter((t) => t.status === "done").length;
      const total = eTasks.length || 1;
      return { id: e.id, kind: "employee", name: e.name, done, total: eTasks.length,
        pct: Math.round((done / total) * 100), tasks: eTasks, ...rowNote(eTasks) };
    })
    .filter((r) => r.total > 0);

  const departmentRows = employees.length
    ? [...new Set(tasks.map((t) => t.departmentId))].map((depId) => {
        const dTasks = tasks.filter((t) => t.departmentId === depId);
        const done = dTasks.filter((t) => t.status === "done").length;
        const total = dTasks.length || 1;
        return { id: depId, kind: "department", name: departmentName(depId), done, total: dTasks.length,
          pct: Math.round((done / total) * 100), tasks: dTasks, ...rowNote(dTasks) };
      })
    : [];

  function openDrill(row) {
    setDrill({ title: row.name, list: row.tasks });
  }

  return (
    <div>
      <h1 className="text-xl font-extrabold mb-5">تقرير التشغيل اليومي</h1>

      {attention.length > 0 && (
        <div className="rounded-2xl border border-red-900/50 bg-red-950/20 p-5 mb-6">
          <div className="text-sm font-bold mb-3 flex items-center gap-2 text-red-300">
            <AlertTriangle size={15} /> مهام تحتاج انتباه ({attention.length})
          </div>
          <div className="space-y-2">
            {attention.map((t) => {
              const meta = STATUS_META[t.status];
              return (
                <button key={t.id} onClick={() => setViewTask(t)} className="w-full flex items-center justify-between text-sm">
                  <span className="text-slate-300"><b>{t.title}</b> · {employeeName(t.assignedTo)}</span>
                  <span className="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0" style={{ color: meta.color, background: meta.bg }}>
                    {meta.label}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
        <StatCard label="نسبة إنجاز المهام" value={kpis.completion} suffix="%" color="#2DD4BF" />
        <StatCard label="مؤشر الجودة" value={kpis.quality} suffix="%" color="#34D399" />
        <StatCard label="مهام متأخرة" value={kpis.late} color="#FBBF24" />
        <StatCard label="ملاحظات مفتوحة" value={kpis.openNotes} color="#F87171" />
        <StatCard label="نسبة اعتماد المشرف" value={kpis.approvalRate ?? "—"} suffix={kpis.approvalRate !== null ? "%" : ""} color="#818CF8" />
        <StatCard label="متوسط إغلاق الإجراء" value={kpis.avgCorrectiveMinutes ?? "—"} suffix={kpis.avgCorrectiveMinutes !== null ? " د" : ""} color="#F472B6" />
      </div>

      <div className="rounded-2xl border border-slate-900 bg-slate-900/40 p-5 mb-6">
        <div className="text-sm font-bold mb-3">اتجاه الأداء (آخر 4 أيام)</div>
        <TrendChart points={trendPoints} />
      </div>

      <BreakdownList title="الأداء حسب الموظف — اضغط على الاسم لعرض مهامه" rows={employeeRows} onSelect={openDrill} />
      <BreakdownList title="الأداء حسب القسم — اضغط على القسم لعرض مهامه" rows={departmentRows} onSelect={openDrill} />

      <div className="rounded-2xl border border-slate-900 bg-slate-900/40 p-5">
        <div className="text-sm font-bold mb-4">الإجراءات التصحيحية</div>
        {corrective.length === 0 ? (
          <div className="text-sm text-slate-500">لا توجد إجراءات تصحيحية مسجّلة بعد</div>
        ) : (
          <div className="space-y-2.5">
            {corrective.map((c) => (
              <div key={c.id} className="rounded-xl border border-slate-800 p-3.5 flex items-center justify-between">
                <div>
                  <div className="text-sm font-bold">{c.title}</div>
                  <div className="text-xs text-slate-500 mt-1">المسؤول: {c.responsible} · الموعد: {c.due}</div>
                  {c.note && <div className="text-xs text-slate-400 mt-1">ملاحظة: {c.note}</div>}
                </div>
                {c.status === "closed" ? (
                  <span className="text-xs font-bold px-3 py-1 rounded-full text-emerald-300 bg-emerald-950">مغلقة</span>
                ) : (
                  <button onClick={() => onCloseCorrective(c.id)} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-teal-400 text-slate-950">
                    اعتماد الإغلاق
                  </button>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      {drill && (
        <TaskListModal
          title={drill.title}
          tasks={drill.list}
          departmentName={departmentName}
          employeeName={employeeName}
          onClose={() => setDrill(null)}
          onSelectTask={(t) => setViewTask(t)}
        />
      )}
      {viewTask && (
        <TaskDetailModal task={viewTask} departmentName={departmentName} employeeName={employeeName} onClose={() => setViewTask(null)} />
      )}
    </div>
  );
}

function ModalShell({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-40 bg-black/60 flex items-end md:items-center justify-center p-0 md:p-4">
      <div className="bg-slate-950 border border-slate-800 rounded-t-2xl md:rounded-2xl w-full md:max-w-sm p-5 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-extrabold text-base">{title}</h2>
          <button onClick={onClose} className="text-slate-500"><X size={20} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div className="mb-3">
      <label className="text-xs text-slate-400 mb-1.5 block">{label}</label>
      {children}
    </div>
  );
}

const inputCls = "w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 outline-none focus:border-teal-500";

function AddTaskModal({ employees, departments, onClose, onSubmit }) {
  const [title, setTitle] = useState("");
  const [time, setTime] = useState("");
  const [assignedTo, setAssignedTo] = useState(employees[0]?.id || "");
  const [standardLabel, setStandardLabel] = useState("");
  const [day, setDay] = useState(DAYS[0]);
  const [shift, setShift] = useState(employees[0]?.shift || SHIFTS[0]);

  const employeeBranch = employees.find((e) => e.id === assignedTo)?.branchId;
  const branchDepartments = departments.filter((d) => !employeeBranch || d.branchId === employeeBranch);
  const [departmentId, setDepartmentId] = useState(branchDepartments[0]?.id || "");

  function pickEmployee(id) {
    setAssignedTo(id);
    const emp = employees.find((e) => e.id === id);
    if (emp?.shift) setShift(emp.shift);
    const opts = departments.filter((d) => d.branchId === emp?.branchId);
    setDepartmentId(opts[0]?.id || "");
  }

  return (
    <ModalShell title="إضافة مهمة يومية" onClose={onClose}>
      <Field label="عنوان المهمة">
        <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="مثال: تنظيف ماكينة القهوة" />
      </Field>
      <Field label="إسناد إلى">
        <select className={inputCls} value={assignedTo} onChange={(e) => pickEmployee(e.target.value)}>
          {employees.map((e) => (<option key={e.id} value={e.id}>{e.name} — {ROLE_LABEL[e.role]}</option>))}
        </select>
      </Field>
      <Field label="القسم">
        {branchDepartments.length === 0 ? (
          <div className="text-xs text-amber-400">لا يوجد أقسام لفرع هذا الموظف بعد — أضف قسم من تبويب "الأقسام" أولاً</div>
        ) : (
          <select className={inputCls} value={departmentId} onChange={(e) => setDepartmentId(e.target.value)}>
            {branchDepartments.map((d) => (<option key={d.id} value={d.id}>{d.name}</option>))}
          </select>
        )}
      </Field>
      <Field label="الوقت">
        <input className={inputCls} value={time} onChange={(e) => setTime(e.target.value)} placeholder="مثال: 5:00 م" />
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="اليوم">
          <select className={inputCls} value={day} onChange={(e) => setDay(e.target.value)}>
            {DAYS.map((d) => (<option key={d} value={d}>{d}</option>))}
          </select>
        </Field>
        <Field label="الوردية">
          <select className={inputCls} value={shift} onChange={(e) => setShift(e.target.value)}>
            {SHIFTS.map((s) => (<option key={s} value={s}>{s}</option>))}
          </select>
        </Field>
      </div>
      <Field label="المعيار المطلوب">
        <input className={inputCls} value={standardLabel} onChange={(e) => setStandardLabel(e.target.value)} placeholder="مثال: نظيفة وجاهزة للاستخدام" />
      </Field>
      <button disabled={!title || !assignedTo || !departmentId}
        onClick={() => onSubmit({ title, departmentId, time, assignedTo, standardLabel, day, shift })}
        className="w-full bg-teal-400 disabled:opacity-40 text-slate-950 font-bold py-2.5 rounded-xl mt-2">
        إضافة المهمة
      </button>
    </ModalShell>
  );
}

function randomPin() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

function AddUserModal({ employees, branches, onClose, onSubmit }) {
  const [name, setName] = useState("");
  const [title, setTitle] = useState("");
  const [role, setRole] = useState("employee");
  const [shift, setShift] = useState("صباحية");
  const [pin, setPin] = useState(randomPin());
  const [branchId, setBranchId] = useState(branches[0]?.id || "");
  const supervisors = employees.filter((e) => e.role === "supervisor" && (branches.length <= 1 || e.branchId === branchId));
  const [supervisorId, setSupervisorId] = useState(supervisors[0]?.id || "");

  function pickBranch(id) {
    setBranchId(id);
    const opts = employees.filter((e) => e.role === "supervisor" && e.branchId === id);
    setSupervisorId(opts[0]?.id || "");
  }

  return (
    <ModalShell title="إنشاء مستخدم جديد" onClose={onClose}>
      <Field label="الاسم">
        <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="اسم الموظف" />
      </Field>
      <Field label="المسمى الوظيفي">
        <input className={inputCls} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="مثال: موظف مطبخ" />
      </Field>
      <Field label="مستوى الصلاحية">
        <select className={inputCls} value={role} onChange={(e) => setRole(e.target.value)}>
          <option value="employee">موظف</option>
          <option value="supervisor">مشرف</option>
          <option value="manager">مدير</option>
          <option value="admin">مالك / إدارة</option>
        </select>
      </Field>
      {role !== "admin" && role !== "manager" && branches.length > 1 && (
        <Field label="الفرع">
          <select className={inputCls} value={branchId} onChange={(e) => pickBranch(e.target.value)}>
            {branches.map((b) => (<option key={b.id} value={b.id}>{b.name}</option>))}
          </select>
        </Field>
      )}
      {role !== "admin" && role !== "manager" && (
        <Field label="الوردية">
          <select className={inputCls} value={shift} onChange={(e) => setShift(e.target.value)}>
            {SHIFTS.map((s) => (<option key={s} value={s}>{s}</option>))}
          </select>
        </Field>
      )}
      {role === "employee" && supervisors.length > 0 && (
        <Field label="يتبع للمشرف">
          <select className={inputCls} value={supervisorId} onChange={(e) => setSupervisorId(e.target.value)}>
            {supervisors.map((s) => (<option key={s.id} value={s.id}>{s.name}</option>))}
          </select>
        </Field>
      )}
      <Field label="الرقم السري">
        <div className="flex gap-2">
          <input className={inputCls} value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, "").slice(0, 4))} />
          <button onClick={() => setPin(randomPin())} className="shrink-0 text-xs px-3 rounded-xl border border-slate-800 text-slate-400 hover:text-teal-300">
            توليد
          </button>
        </div>
      </Field>
      <button disabled={!name || pin.length !== 4}
        onClick={() => onSubmit({
          name, title, role, pin,
          shift: (role === "admin" || role === "manager") ? null : shift,
          supervisorId: role === "employee" ? supervisorId : null,
          branchId: (role === "admin" || role === "manager") ? null : branchId,
        })}
        className="w-full bg-teal-400 disabled:opacity-40 text-slate-950 font-bold py-2.5 rounded-xl mt-2">
        إنشاء المستخدم
      </button>
    </ModalShell>
  );
}

function EmployeeApp({ user, tasks, departmentName, onOpenTask }) {
  const [screen, setScreen] = useState("home");
  const myTasks = tasks.filter((t) => t.assignedTo === user.id);
  const pendingTasks = myTasks.filter((t) => t.status !== "done" && t.status !== "non_compliant");
  const doneTasks = myTasks.filter((t) => t.status === "done" || t.status === "non_compliant");
  const topTask = pendingTasks[0];

  return (
    <div className="py-8 flex flex-col items-center gap-4">
      <div className="w-[360px] rounded-[2.2rem] border-[6px] border-slate-800 bg-slate-950 shadow-2xl overflow-hidden">
        <div className="h-6 flex items-center justify-center bg-slate-950">
          <div className="w-24 h-4 bg-slate-900 rounded-full" />
        </div>

        <div className="h-[640px] overflow-y-auto px-4 pb-16 pt-2">
          {screen === "home" && (
            <div>
              <div className="text-lg font-extrabold mb-0.5">أهلاً {user.name.split(" ")[0]}</div>
              <div className="text-xs text-slate-500 mb-4">{user.title}</div>

              <div className="grid grid-cols-2 gap-2.5 mb-5">
                <StatCard label="مهام منجزة اليوم" value={doneTasks.length} color="#2DD4BF" />
                <StatCard label="مهام متبقية" value={pendingTasks.length} color="#FBBF24" />
              </div>

                <div className="rounded-2xl border border-teal-900 bg-teal-950/40 p-4 mb-4">
                  <div className="text-xs text-teal-400 font-bold mb-1.5">أهم مهمة الآن</div>
                  <div className="font-bold text-sm mb-1">{topTask.title}</div>
                  <div className="text-xs text-slate-400 mb-3">{departmentName(topTask.departmentId)} · {topTask.time}</div>
                  <button onClick={() => onOpenTask(topTask)} className="w-full bg-teal-400 text-slate-950 font-bold text-sm py-2 rounded-xl">
                    ابدأ المهمة
                  </button>
                </div>
              ) : (
                <div className="rounded-2xl border border-slate-900 bg-slate-900/40 p-4 mb-4 text-sm text-slate-400">
                  لا توجد مهام معلّقة حالياً 🎉
                </div>
              )}

              <div className="text-sm font-bold mb-2">مهامي اليوم</div>
              <TaskList tasks={pendingTasks.filter((t) => t.day === "اليوم" || t.day === "دائمة")} departmentName={departmentName} onOpenTask={onOpenTask} />
            </div>
          )}

          {screen === "tasks" && (
            <div>
              <div className="text-lg font-extrabold mb-1">مهامي</div>
              <div className="text-xs text-slate-500 mb-4">وردية {user.shift || "—"}</div>
              {DAYS.map((d) => {

                  </div>

            <div>
              <div className="text-lg font-extrabold mb-4">سجل المهام المنجزة</div>

                <div className="text-sm text-slate-500">لا توجد مهام منجزة بعد</div>
              ) : (
                <div className="space-y-2">
                  {doneTasks.map((t) => {

          <button onClick={() => setScreen("home")} className="flex flex-col items-center gap-0.5">
            <Home size={18} className={screen === "home" ? "text-teal-400" : "text-slate-600"} />
            <span className={`text-[10px] ${screen === "home" ? "text-teal-400" : "text-slate-600"}`}>الرئيسية</span>
          </button>
          <button onClick={() => setScreen("tasks")} className="flex flex-col items-center gap-0.5">
            <ClipboardList size={18} className={screen === "tasks" ? "text-teal-400" : "text-slate-600"} />
            <span className={`text-[10px] ${screen === "tasks" ? "text-teal-400" : "text-slate-600"}`}>المهام</span>
          </button>
          <button onClick={() => setScreen("history")} className="flex flex-col items-center gap-0.5">
            <History size={18} className={screen === "history" ? "text-teal-400" : "text-slate-600"} />
            <span className={`text-[10px] ${screen === "history" ? "text-teal-400" : "text-slate-600"}`}>السجل</span>
          </button>
        </div>
      </div>
    </div>
  );
}

function TaskList({ tasks, departmentName, onOpenTask }) {
  if (tasks.length === 0) return <div className="text-sm text-slate-500">لا توجد مهام معلّقة 🎉</div>;
  return (
    <div className="space-y-2">
      {tasks.map((t) => {
        const meta = STATUS_META[t.status];
        return (
          <button key={t.id} onClick={() => onOpenTask(t)}
            className="w-full text-right rounded-xl border border-slate-900 bg-slate-900/40 p-3.5 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <div className="font-bold text-sm">{t.title}</div>
                <ShiftBadge shift={t.shift} />
              </div>
              <div className="text-xs text-slate-500 flex items-center gap-1">
                <Clock size={11} /> {departmentName(t.departmentId)} · {t.time}
              </div>
            </div>
            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0" style={{ color: meta.color, background: meta.bg }}>
              {meta.label}
            </span>
          </button>
        );
      })}
    </div>
  );
}

// ---------------- Task execution modal ----------------

function CameraCapture({ photo, onCapture, onClear }) {
  const [active, setActive] = useState(false);
  const [error, setError] = useState("");
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);

  async function openCamera() {
    setError("");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      streamRef.current = stream;
      setActive(true);
      setTimeout(() => {
        if (videoRef.current) videoRef.current.srcObject = stream;
      }, 0);
    } catch (err) {
      setError("تعذّر الوصول للكاميرا — تأكد من الموافقة على الإذن من المتصفح");
    }
  }

  function closeStream() {
    streamRef.current?.getTracks().forEach((tr) => tr.stop());
    streamRef.current = null;
    setActive(false);
  }

  function takeShot() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    onCapture(dataUrl);
    closeStream();
  }

  if (photo) {
    return (
      <div className="mb-3">
        <img src={photo} alt="دليل التنفيذ" className="w-full h-40 object-cover rounded-xl border border-teal-700 mb-2" />
        <button onClick={onClear} className="w-full flex items-center justify-center gap-2 border border-slate-800 text-slate-400 rounded-xl py-2 text-xs">
          <Camera size={14} /> إعادة التقاط الصورة
        </button>
      </div>
    );
  }

  if (active) {
    return (
      <div className="mb-3">
        <video ref={videoRef} autoPlay playsInline className="w-full h-40 object-cover rounded-xl border border-teal-700 mb-2 bg-black" />
        <canvas ref={canvasRef} className="hidden" />
        <div className="flex gap-2">
          <button onClick={takeShot} className="flex-1 bg-teal-400 text-slate-950 font-bold rounded-xl py-2 text-sm">التقاط</button>
          <button onClick={closeStream} className="px-4 border border-slate-800 text-slate-400 rounded-xl text-sm">إلغاء</button>
        </div>
      </div>
    );
  }

  return (
    <div className="mb-3">
      <button onClick={openCamera} className="w-full flex items-center justify-center gap-2 border border-slate-800 text-slate-400 rounded-xl py-2.5 text-sm">
        <Camera size={16} /> فتح الكاميرا وإرفاق صورة
      </button>
      {error && <div className="text-[11px] text-red-400 mt-1.5">{error}</div>}
    </div>
  );
}

function TaskExecuteModal({ task, departmentName, onClose, onSubmit }) {
  const [result, setResult] = useState("");
  const [note, setNote] = useState("");
  const [photo, setPhoto] = useState(null);

  const hasNumericStandard = typeof task.standardMin === "number";
  let compliant = true;
  if (hasNumericStandard && result !== "") {
    const val = parseFloat(result);
    compliant = !isNaN(val) && val >= task.standardMin && val <= task.standardMax;
  }

  return (
    <ModalShell title={task.title} onClose={onClose}>
      <div className="text-xs text-slate-500 mb-4">{departmentName(task.departmentId)} · {task.time}</div>

      <div className="rounded-xl bg-slate-900 border border-slate-800 p-3 mb-4 flex items-center gap-2 text-sm">
        <ThermometerSun size={16} className="text-teal-400 shrink-0" />
        <span className="text-slate-300">{task.standardLabel}</span>
      </div>

      {hasNumericStandard ? (
        <Field label={`النتيجة (${task.unit})`}>
          <input className={inputCls} type="number" step="0.1" value={result}
            onChange={(e) => setResult(e.target.value)} placeholder="مثال: 3.4" />
        </Field>
      ) : (
        <Field label="حالة التنفيذ">
          <div className="flex gap-2">
            <button onClick={() => setResult("مطابق")}
              className={`flex-1 py-2 rounded-xl text-sm font-bold border ${result === "مطابق" ? "bg-emerald-500/20 border-emerald-500 text-emerald-300" : "border-slate-800 text-slate-400"}`}>
              مطابق
            </button>
            <button onClick={() => setResult("غير مطابق")}
              className={`flex-1 py-2 rounded-xl text-sm font-bold border ${result === "غير مطابق" ? "bg-red-500/20 border-red-500 text-red-300" : "border-slate-800 text-slate-400"}`}>
              غير مطابق
            </button>
          </div>
        </Field>
      )}

      {result !== "" && (
        <div className="text-xs font-bold px-3 py-2 rounded-lg mb-3 inline-flex items-center gap-1.5"
          style={{
            color: (hasNumericStandard ? compliant : result === "مطابق") ? "#34D399" : "#F87171",
            background: (hasNumericStandard ? compliant : result === "مطابق") ? "rgba(52,211,153,0.12)" : "rgba(248,113,113,0.12)",
          }}>
          {(hasNumericStandard ? compliant : result === "مطابق") ? <CheckCircle2 size={14} /> : <AlertTriangle size={14} />}
          {(hasNumericStandard ? compliant : result === "مطابق") ? "ضمن المعيار" : "غير مطابق للمعيار"}
        </div>
      )}

      <CameraCapture photo={photo} onCapture={setPhoto} onClear={() => setPhoto(null)} />

      {!(hasNumericStandard ? compliant : result === "مطابق") && result !== "" && (
        <Field label="وصف المشكلة / ملاحظة">
          <textarea className={inputCls} rows={2} value={note} onChange={(e) => setNote(e.target.value)} placeholder="اكتب وصف المشكلة..." />
        </Field>
      )}

      <button disabled={result === ""}
        onClick={() => onSubmit(task.id, { result, compliant: hasNumericStandard ? compliant : result === "مطابق", note, photo })}
        className="w-full bg-teal-400 disabled:opacity-40 text-slate-950 font-bold py-2.5 rounded-xl mt-1">
        إتمام المهمة
      </button>
    </ModalShell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CheckflowDemo />);
</script>
